<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear examen | Foco Examen</title>
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <script type="importmap">
    { "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js",
      "firebase/database": "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js"
    } }
  </script>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a class="brand" href="../" data-i18n="app.name">Foco Examen</a>
      <div class="row">
        <span class="small muted" id="user-email" hidden></span>
        <button class="btn-quiet small" id="btn-signout" hidden data-i18n="auth.signOut">Cerrar sesión</button>
        <div class="lang-switch"></div>
      </div>
    </header>

    <p class="muted" id="loading" data-i18n="common.loading">Cargando…</p>

    <section class="sheet stack" id="signin" hidden>
      <h1 data-i18n="auth.title">Acceso del profesor</h1>
      <p data-i18n="auth.text">Entra con tu cuenta de Google para crear exámenes y ver sus paneles desde cualquier navegador.</p>
      <p class="error" id="signin-error" role="alert" hidden></p>
      <div><button class="btn-primary btn-big" id="btn-signin" data-i18n="auth.google">Entrar con Google</button></div>
    </section>

    <div id="teacher" hidden>
      <section class="sheet" id="my-exams" hidden>
        <h2 data-i18n="create.myExams">Tus exámenes</h2>
        <ul id="my-exams-list"></ul>
      </section>

      <form class="sheet stack" id="create-form" novalidate>
        <h1 data-i18n="create.title">Crear examen</h1>

        <div>
          <label for="f-name" data-i18n="create.name">Nombre del examen</label>
          <input type="text" id="f-name" required maxlength="120" data-i18n-attr="placeholder:create.namePh">
        </div>

        <div>
          <label for="f-duration"><span data-i18n="create.duration">Duración</span> <span class="hint" data-i18n="create.durationHint">En minutos</span></label>
          <input type="number" id="f-duration" min="1" max="600" value="90" required style="max-width: 10ch">
        </div>

        <fieldset>
          <legend data-i18n="create.tools">Herramientas permitidas</legend>
          <div id="tools"></div>
          <p style="margin-top: 8px"><button type="button" class="btn-quiet" id="add-tool" data-i18n="create.addTool">Añadir herramienta</button></p>
        </fieldset>

        <fieldset>
          <legend data-i18n="create.mode">Cómo se abren las herramientas</legend>
          <label class="choice">
            <input type="radio" name="mode" value="pestana" checked>
            <span><strong data-i18n="create.modeTab">Dentro de la página del examen</strong>
              <span class="hint" data-i18n="create.modeTabHint"></span></span>
          </label>
          <label class="choice">
            <input type="radio" name="mode" value="ventana">
            <span><strong data-i18n="create.modeWindow">En su propia ventana</strong>
              <span class="hint" data-i18n="create.modeWindowHint"></span></span>
          </label>
        </fieldset>

        <details>
          <summary data-i18n="create.alerts">Avisos y tolerancia</summary>
          <div class="stack" style="margin-top: 16px">
            <div>
              <label for="f-tolerance"><span data-i18n="create.tolerance">Tolerancia antes de contar incidencia</span> <span class="hint" data-i18n="create.toleranceHint">Evita avisos por un clic accidental</span></label>
              <select id="f-tolerance" style="max-width: 24ch">
                <option value="0" data-i18n="create.tolNone">Ninguna</option>
                <option value="3" selected data-i18n="create.tol3">3 segundos</option>
                <option value="5" data-i18n="create.tol5">5 segundos</option>
                <option value="10" data-i18n="create.tol10">10 segundos</option>
              </select>
            </div>
            <div>
              <label for="f-alert" data-i18n="create.alertText">Mensaje que ve el alumno al volver</label>
              <textarea id="f-alert" maxlength="300"></textarea>
            </div>
          </div>
        </details>

        <p class="error" id="create-error" role="alert" hidden></p>
        <div><button type="submit" class="btn-primary btn-big" data-i18n="create.submit">Crear examen</button></div>
      </form>
    </div>
  </main>

  <template id="tool-row">
    <div class="tool-row">
      <input type="text" class="t-name" maxlength="60" data-i18n-attr="placeholder:create.toolName;aria-label:create.toolNameLabel">
      <input type="url" class="t-url" placeholder="https://…" data-i18n-attr="aria-label:create.toolUrlLabel">
      <button type="button" class="btn-quiet t-del" data-i18n="create.removeTool">Quitar</button>
    </div>
  </template>

  <script type="module" src="crear.js"></script>
</body>
</html>
