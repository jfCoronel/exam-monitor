<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exam Monitor</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 32px; }
    .choices a { display: block; text-decoration: none; color: inherit; }
    .choices a:hover .sheet { border-color: var(--pen); }
    .choices h2 { color: var(--pen); }
    @media (max-width: 560px) { .choices { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="lang-switch lang-float"></div>
  <main class="page">
    <h1 class="brand-title"><img src="icons/icon.svg" alt=""> <span data-i18n="app.name">Exam Monitor</span></h1>
    <p class="muted" data-i18n="home.tagline">Supervisa que los alumnos usen solo las herramientas permitidas durante un examen presencial.</p>
    <div class="choices">
      <a href="alumno/"><div class="sheet"><h2 data-i18n="home.student">Soy alumno</h2><p class="muted small" data-i18n="home.studentText">Únete con el código que te dé el profesor.</p></div></a>
      <a href="profesor/"><div class="sheet"><h2 data-i18n="home.teacher">Soy profesor</h2><p class="muted small" data-i18n="home.teacherText">Crea un examen y sigue la clase en directo.</p></div></a>
    </div>
  </main>
  <footer class="site-footer"></footer>
  <script type="module">
    import { t, mountLangSwitch } from './i18n/index.js';
    import { mountFooter } from './common.js';
    mountFooter();
    mountLangSwitch();
    const title = () => { document.title = t('app.name'); };
    title();
    document.addEventListener('langchange', title);
  </script>
</body>
</html>
