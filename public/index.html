<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foco Examen</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 32px; }
    .choices a { display: block; text-decoration: none; color: inherit; }
    .choices a:hover .sheet { border-color: var(--pen); }
    .choices h2 { color: var(--pen); }
    @media (max-width: 560px) { .choices { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="page">
    <h1>Foco Examen</h1>
    <p class="muted">Supervisa que los alumnos usen solo las herramientas permitidas durante un examen presencial.</p>
    <div class="choices">
      <a href="/alumno/"><div class="sheet"><h2>Soy alumno</h2><p class="muted small">Únete con el código que te dé el profesor.</p></div></a>
      <a href="/profesor/"><div class="sheet"><h2>Soy profesor</h2><p class="muted small">Crea un examen y sigue la clase en directo.</p></div></a>
    </div>
  </main>
</body>
</html>
